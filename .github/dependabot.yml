version: 2

updates:
  # PHP Composer dependencies
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - php

  # Root npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # Admin package npm dependencies
  - package-ecosystem: npm
    directory: /packages/Webkul/Admin
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - admin

  # Installer package npm dependencies
  - package-ecosystem: npm
    directory: /packages/Webkul/Installer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - installer

  # WebForm package npm dependencies
  - package-ecosystem: npm
    directory: /packages/Webkul/WebForm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - webform

  # Docker base images
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
