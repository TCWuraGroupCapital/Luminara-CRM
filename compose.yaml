# Build once, run with a persistent local database.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Luminara CRM"
      APP_URL: http://localhost:${APP_PORT:-8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Australia/Melbourne}
      APP_LOCALE: en
      APP_CURRENCY: ${APP_CURRENCY:-AUD}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: luminara_crm
      DB_USERNAME: luminara
      DB_PASSWORD: luminara_local_only
      MAIL_MAILER: log
      LUMINARA_ASSISTANT_API_KEY: ${LUMINARA_ASSISTANT_API_KEY:-}
      LUMINARA_ASSISTANT_MODEL: ${LUMINARA_ASSISTANT_MODEL:-claude-opus-5-5}
      LUMINARA_ASSISTANT_BASE_URL: ${LUMINARA_ASSISTANT_BASE_URL:-}
      LUMINARA_LEDGER_SEED: ${LUMINARA_LEDGER_SEED:-}
      LEDGER_ANCHOR_DRIVER: ${LEDGER_ANCHOR_DRIVER:-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GOURWEST_WEBHOOK_SECRET: ${GOURWEST_WEBHOOK_SECRET:-}
      TON_ANCHOR_RELAYER_URL: ${TON_ANCHOR_RELAYER_URL:-}
      TON_ANCHOR_CONTRACT: ${TON_ANCHOR_CONTRACT:-}
    volumes:
      - luminara_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db:
    image: mysql:8.0.32
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: luminara_crm
      MYSQL_USER: luminara
      MYSQL_PASSWORD: luminara_local_only
      MYSQL_ROOT_PASSWORD: luminara_root_local_only
    volumes:
      - luminara_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  luminara_mysql:
  luminara_storage:
